<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f2f5c">
    <link rel="manifest" href="manifest.json?v=10">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>منظومة الإشراف والتوجيه التربوي للمدارس الشرعية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (xlsx) -->
    <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: { emerald: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#1d4f91',700:'#173f78',800:'#0f2f5c',900:'#0a2347' } }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        @media print { .no-print { display: none !important; } body { background: white !important; } }
    </style>
    <link rel="stylesheet" href="theme.css?v=17">
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col custom-scrollbar">

    <!-- شريط الرأس والتحكم العلوي (تم تحديثه) -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 py-2">
                
                <!-- الأيقونة فقط (تم إخفاء الاسم لتوضيح الأزرار) -->
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-emerald-700 to-teal-500 text-white flex items-center justify-center shadow-md shadow-emerald-700/20">
                        <i class="fa-solid fa-mosque text-xl"></i>
                    </div>
                </div>

                <!-- الأزرار بتصميم واضح وحديث -->
                <div class="flex items-center gap-2">
                    <button onclick="runIntelligentDistribution()" class="w-10 h-10 md:w-auto md:px-4 md:py-2 flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-xl text-sm font-bold shadow-md active:scale-95 transition">
                        <i class="fa-solid fa-calendar-check"></i>
                        <span class="hidden md:inline">جدولة</span>
                    </button>
                    
                    <button onclick="exportComprehensiveExcel()" class="w-10 h-10 md:w-auto md:px-4 md:py-2 flex items-center justify-center gap-2 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl text-sm font-bold transition">
                        <i class="fa-solid fa-file-excel text-emerald-600"></i>
                        <span class="hidden md:inline">تصدير</span>
                    </button>

                    <button onclick="openWaReport()" class="w-10 h-10 md:w-auto md:px-4 md:py-2 flex items-center justify-center gap-2 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl text-sm font-bold transition" title="تقرير واتساب">
                        <i class="fa-brands fa-whatsapp text-emerald-600"></i>
                        <span class="hidden md:inline">واتساب</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- بطاقة التعريف بالنظام المعتمد -->
        <section id="app-hero" class="bg-gradient-to-r from-slate-900 via-slate-800 to-emerald-950 text-white rounded-3xl p-5 sm:p-6 shadow-xl no-print relative overflow-hidden">
            <div class="relative z-10 grid grid-cols-1 lg:grid-cols-12 gap-5 items-center">
                <div class="lg:col-span-5 space-y-1">
                    <span class="inline-flex items-center gap-1.5 bg-emerald-500/20 text-emerald-300 text-xs px-2.5 py-1 rounded-lg border border-emerald-400/30">
                        <i class="fa-solid fa-users-gear text-[11px]"></i>
                        <span>قاعدة الإشراف الشامل والمفتوح</span>
                    </span>
                    <h2 class="text-lg font-bold text-white">الموجهون مسؤولون عن كافة المدارس من نفس الجنس</h2>
                    <p class="text-xs text-slate-300 leading-relaxed">
                        جميع الموجهين الذكور يشرفون على كافة مدارس البنين، وجميع الموجهات الإناث يشرفن على كافة مدارس البنات.
                    </p>
                </div>

                <div class="lg:col-span-7 grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <!-- تم تصحيح لون حقل التاريخ ليكون واضحاً -->
                    <div class="bg-white/10 backdrop-blur-md rounded-2xl p-3 border border-white/10">
                        <label class="block text-[11px] font-semibold text-emerald-200 mb-1">تاريخ بداية الجولة</label>
                        <input type="date" id="plan-start-date" class="w-full bg-white text-slate-900 border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-emerald-400">
                    </div>
                    <div class="bg-white/10 backdrop-blur-md rounded-2xl p-3 border border-white/10">
                        <label class="block text-[11px] font-semibold text-emerald-200 mb-1">تاريخ نهاية الجولة</label>
                        <input type="date" id="plan-end-date" class="w-full bg-white text-slate-900 border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-emerald-400">
                    </div>
                    <div class="bg-white/10 backdrop-blur-md rounded-2xl p-3 border border-white/10">
                        <label class="block text-[11px] font-semibold text-emerald-200 mb-1">فريق الزيارة</label>
                        <button onclick="openTeamBuilder()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-white rounded-xl px-3 py-2 text-xs font-bold flex items-center justify-center gap-2 mt-1"><i class="fa-solid fa-people-group"></i><span>حدّد الفريق حسب الحصص</span></button>
                        <select id="team-size-per-school" class="hidden"><option value="ALL">ALL</option></select>
                    </div>
                </div>
            </div>
        </section>

        <!-- لوحة الإحصائيات -->
        <section id="app-stats" class="grid grid-cols-2 lg:grid-cols-4 gap-3 no-print">
            <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg"><i class="fa-solid fa-person"></i></div>
                <div><p class="text-[11px] font-medium text-slate-500">الموجهون الذكور</p><p class="text-xl font-bold text-slate-800"><span id="stat-male-sup">0</span></p></div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-lg"><i class="fa-solid fa-person-dress"></i></div>
                <div><p class="text-[11px] font-medium text-slate-500">الموجهات الإناث</p><p class="text-xl font-bold text-slate-800"><span id="stat-female-sup">0</span></p></div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg"><i class="fa-solid fa-school"></i></div>
                <div><p class="text-[11px] font-medium text-slate-500">مدارس البنين</p><p class="text-xl font-bold text-slate-800" id="stat-male-sch">0</p></div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center text-lg"><i class="fa-solid fa-school-flag"></i></div>
                <div><p class="text-[11px] font-medium text-slate-500">مدارس البنات</p><p class="text-xl font-bold text-slate-800" id="stat-female-sch">0</p></div>
            </div>
        </section>

        <!-- شريط التبويبات -->
        <div id="app-tabs" class="flex flex-wrap items-center justify-between border-b border-slate-200 pb-2 no-print gap-2">
            <div class="flex items-center gap-1.5 overflow-x-auto">
                <button onclick="switchView('distribution')" id="tab-btn-distribution" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold bg-emerald-600 text-white flex items-center gap-2 shadow-xs transition"><i class="fa-solid fa-calendar-days"></i><span>الزيارات</span></button>
                <button onclick="switchView('supervisors')" id="tab-btn-supervisors" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:bg-slate-100 transition flex items-center gap-2"><i class="fa-solid fa-user-tie"></i><span>الموجهين</span></button>
                <button onclick="switchView('schools')" id="tab-btn-schools" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:bg-slate-100 transition flex items-center gap-2"><i class="fa-solid fa-mosque"></i><span>المدارس</span></button>
                <button onclick="switchView('schedules')" id="tab-btn-schedules" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:bg-slate-100 transition flex items-center gap-2"><i class="fa-solid fa-table-cells"></i><span>جدول الحصص</span></button>
                <button onclick="switchView('import')" id="tab-btn-import" class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:bg-slate-100 transition flex items-center gap-2"><i class="fa-solid fa-cloud-arrow-down"></i><span>تصدير ونسخ</span></button>
            </div>
        </div>

        <!-- 1. عرض جدول الزيارات والمطابقة -->
        <div id="view-distribution" class="space-y-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex flex-col md:flex-row items-start md:items-center justify-between gap-3 no-
